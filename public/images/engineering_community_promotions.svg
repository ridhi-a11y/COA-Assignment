<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGradPromo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e0a" />
      <stop offset="50%" stop-color="#19130d" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="amberAccentPromo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <pattern id="dotGridPromo" x1="0" y1="0" x2="24" y2="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradPromo)" />
  <rect width="800" height="500" fill="url(#dotGridPromo)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="205" r="190" fill="#F59E0B" fill-opacity="0.09" filter="blur(45px)" />
  <circle cx="650" cy="120" r="130" fill="#FBBF24" fill-opacity="0.05" filter="blur(35px)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Top Metadata -->
  <g transform="translate(60, 60)">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#FBBF24" letter-spacing="3">ENGINEERING COMMUNITY</text>
  </g>

  <!-- Top Right Period Badge -->
  <g transform="translate(540, 56)">
    <rect x="0" y="0" width="200" height="36" rx="8" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="100" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="1">JUL 2026 – PRESENT</text>
  </g>

  <!-- Central Promotion Beacon / Outreach Waves Emblem -->
  <g transform="translate(400, 205)">
    <!-- Expanding outreach rings -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" />
    <circle cx="0" cy="0" r="36" fill="#1C150C" stroke="url(#amberAccentPromo)" stroke-width="2.5" />

    <!-- Stylized megaphone / outreach bullhorn icon -->
    <path d="M-12,-10 L-2,-10 L10,-18 L10,18 L-2,10 L-12,10 Z" fill="#FBBF24" />
    <path d="M14,-10 C18,-5 18,5 14,10" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" />
    <path d="M19,-15 C25,-7 25,7 19,15" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" />
    <rect x="-10" y="10" width="4" height="8" rx="1" fill="#F59E0B" />
  </g>

  <!-- Main Titles -->
  <text x="400" y="340" font-family="'Manrope', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Promotions Manager</text>
  <text x="400" y="375" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#FBBF24" text-anchor="middle" letter-spacing="2">COMMUNITY EXPANSION &amp; CAMPAIGNS</text>

  <!-- Footer context -->
  <text x="400" y="425" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">Promotions Coordination · Outreach Operations · Technical Community</text>
</svg>
