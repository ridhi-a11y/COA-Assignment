<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="50%" stop-color="#101420" />
      <stop offset="100%" stop-color="#0a0b10" />
    </linearGradient>
    <linearGradient id="azureBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#00B4FF" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <pattern id="dotGrid" x1="0" y1="0" x2="24" y2="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#dotGrid)" />

  <!-- Subtle glow -->
  <circle cx="400" cy="220" r="180" fill="#0078D4" fill-opacity="0.08" filter="blur(40px)" />
  <circle cx="680" cy="100" r="140" fill="#F59E0B" fill-opacity="0.05" filter="blur(30px)" />

  <!-- Tech border frame -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Microsoft 4-square logo (top left) -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="14" height="14" fill="#F25022" rx="1.5" />
    <rect x="18" y="0" width="14" height="14" fill="#7FBA00" rx="1.5" />
    <rect x="0" y="18" width="14" height="14" fill="#00A4EF" rx="1.5" />
    <rect x="18" y="18" width="14" height="14" fill="#FFB900" rx="1.5" />
    <text x="42" y="24" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3">MICROSOFT CERTIFIED</text>
  </g>

  <!-- Score Badge (top right) -->
  <g transform="translate(580, 56)">
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.2" />
    <text x="80" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">SCORE: 928 / 1000</text>
  </g>

  <!-- Central Emblem / Hexagon -->
  <g transform="translate(400, 220)">
    <!-- Outer hexagon -->
    <polygon points="0,-85 74,-42 74,42 0,85 -74,42 -74,-42" fill="#141824" stroke="url(#azureBlue)" stroke-width="2.5" stroke-opacity="0.8" />
    <!-- Inner hexagon -->
    <polygon points="0,-68 59,-34 59,34 0,68 -59,34 -59,-34" fill="#0E121E" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
    
    <!-- Stylized Azure Cloud / Diamond Symbol -->
    <path d="M-28,18 L0,-32 L28,18 Z" fill="none" stroke="url(#azureBlue)" stroke-width="3" stroke-linejoin="round" />
    <path d="M-14,24 L14,24 L0,2 Z" fill="url(#azureBlue)" fill-opacity="0.9" />
    <circle cx="0" cy="-6" r="3" fill="#ffffff" />
  </g>

  <!-- Title & Credentials -->
  <text x="400" y="350" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Azure Fundamentals</text>
  <text x="400" y="385" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="#38BDF8" text-anchor="middle" letter-spacing="2">EXAM AZ-900 · 2026</text>

  <!-- Bottom contextual tag -->
  <g transform="translate(400, 428)">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" letter-spacing="0.5">Cloud Architecture · Core Services · Security, Privacy &amp; Compliance</text>
  </g>
</svg>
